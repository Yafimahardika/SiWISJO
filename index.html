<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiWISJO</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #eef2ff;
      --surface:   #ffffff;
      --card:      #ffffff;
      --border:    #d8e0f5;
      --accent:    #4361ee;
      --accent2:   #7b5ea7;
      --accent-lt: #eef1ff;
      --success:   #2cb67d;
      --danger:    #ef4565;
      --warn:      #f4a261;
      --text:      #1a1f36;
      --muted:     #8892aa;
      --shadow:    0 4px 24px rgba(67,97,238,.12);
      --sans:      'Nunito', sans-serif;
      --mono:      'JetBrains Mono', monospace;
    }

    /* ── Page base ── */
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 1rem 5rem;
      overflow-x: hidden;
    }

    /* ── Animated gradient hero banner ── */
    .hero-banner {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #4361ee 0%, #7b5ea7 50%, #06b6d4 100%);
      background-size: 300% 300%;
      animation: gradShift 8s ease infinite;
      padding: 2.5rem 1.5rem 5rem;
      margin: 0 -1rem 0;
    }
    @keyframes gradShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      animation: floatOrb 6s ease-in-out infinite;
    }
    .orb1 { width:180px; height:180px; top:-40px; right:-40px; animation-delay:0s; }
    .orb2 { width:100px; height:100px; bottom:10px; left:15%; animation-delay:2s; }
    .orb3 { width: 60px; height: 60px; top:30px;  left:40%; animation-delay:4s; }
    @keyframes floatOrb {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-18px) scale(1.06); }
    }

    /* Header inside hero */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1rem;
      animation: slideDown .6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes slideDown {
      from { opacity:0; transform: translateY(-20px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .logo {
      width: 56px; height: 56px;
      background: rgba(255,255,255,.2);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 1.55rem; font-weight: 900; color: #fff; letter-spacing: -.02em; }
    .header-text p  { font-size: .78rem; color: rgba(255,255,255,.72); margin-top: 3px; }

    .firebase-badge {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 20px;
      padding: 5px 13px;
      font-size: .72rem; font-weight: 700; color: #fff;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--warn);
      animation: pulse 1.8s infinite;
    }
    .dot.connected { background: #4ade80; animation: none; }
    .dot.error     { background: var(--danger); animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Layout ── */
    .layout {
      max-width: 860px;
      margin: -2.5rem auto 0;
      display: grid;
      gap: 1.5rem;
      position: relative;
      z-index: 3;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 1.85rem;
      box-shadow: var(--shadow);
      animation: cardIn .5s cubic-bezier(.22,1,.36,1) both;
    }
    .card:nth-child(2) { animation-delay: .1s; }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(30px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .card-title {
      font-size: .68rem; font-weight: 800;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1.3rem;
      display: flex; align-items: center; gap: .5rem;
    }
    .card-title::after { content:''; flex:1; height:1px; background: var(--border); }

    /* ── Form grid ── */
    .form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-row4 { display: grid; grid-template-columns: 160px 1fr 1fr 1fr; gap: 1rem; align-items: end; }
    @media(max-width:680px) { .form-row4 { grid-template-columns: 1fr 1fr; } }
    @media(max-width:420px) { .form-row4, .form-row2 { grid-template-columns: 1fr; } }

    /* ── Field ── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: .73rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }

    input[type="text"],
    input[type="date"] {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: .62rem .9rem;
      font-size: .875rem;
      font-family: var(--sans);
      color: var(--text);
      outline: none;
      transition: border-color .18s, box-shadow .18s, transform .15s;
      width: 100%;
    }
    input[type="text"]:focus,
    input[type="date"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(67,97,238,.13);
      transform: translateY(-1px);
    }
    input::placeholder { color: var(--muted); }
    input.id-input {
      font-family: var(--mono);
      font-size: .8rem;
      color: var(--accent);
      font-weight: 600;
      cursor: default;
    }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.3rem; }
    button {
      padding: .62rem 1.35rem;
      border-radius: 11px;
      font-family: var(--sans);
      font-size: .82rem; font-weight: 700;
      cursor: pointer; border: none;
      transition: opacity .15s, transform .12s, box-shadow .15s;
      position: relative; overflow: hidden;
    }
    /* ripple */
    button::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,.25);
      border-radius: inherit;
      transform: scale(0);
      transition: transform .4s, opacity .4s;
      opacity: 0;
    }
    button:active::after { transform: scale(2); opacity: 0; transition: 0s; }
    button:active { transform: scale(.96); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 14px rgba(67,97,238,.35);
    }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(67,97,238,.45); transform: translateY(-1px); }
    .btn-secondary { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: #fff0f3; color: var(--danger); border: 1.5px solid var(--danger); }
    .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }

    /* ── Spinner ── */
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--accent); color: #fff;
      padding: .7rem 1.2rem; border-radius: 12px;
      font-size: .8rem; font-weight: 700;
      opacity: 0; transform: translateY(16px) scale(.95);
      transition: opacity .25s, transform .25s;
      pointer-events: none; z-index: 999; max-width: 300px;
      box-shadow: 0 6px 24px rgba(0,0,0,.18);
    }
    #toast.show { opacity: 1; transform: translateY(0) scale(1); }
    #toast.err  { background: var(--danger); }
    #toast.ok   { background: var(--success); }

    /* ── Table bar ── */
    .tbl-bar {
      display: flex; align-items: center;
      justify-content: space-between;
      flex-wrap: wrap; gap: .75rem; margin-bottom: 1rem;
    }
    .count-badge {
      background: var(--accent-lt); color: var(--accent);
      font-size: .72rem; font-weight: 800;
      padding: 3px 11px; border-radius: 20px;
    }
    .search-wrap { position: relative; }
    .search-wrap input { padding-left: 2.1rem; min-width: 210px; }
    .search-icon {
      position: absolute; left: .7rem; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); font-size: .85rem; pointer-events: none;
    }

    /* ── Table ── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .83rem; }
    thead th {
      text-align: left; padding: .55rem .85rem;
      font-size: .67rem; font-weight: 800;
      letter-spacing: .07em; text-transform: uppercase;
      color: var(--muted); border-bottom: 2px solid var(--border);
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .12s, transform .12s;
      animation: rowIn .35s ease both;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg); }
    tbody tr.is-editing { background: var(--accent-lt); }
    @keyframes rowIn {
      from { opacity:0; transform: translateX(-8px); }
      to   { opacity:1; transform: translateX(0); }
    }
    td { padding: .68rem .85rem; vertical-align: middle; }
    td.cell-id { font-family: var(--mono); font-size: .77rem; color: var(--accent); font-weight: 600; }
    td.cell-ttl { font-size: .8rem; color: var(--muted); }

    .actions { display: flex; gap: .4rem; }
    .btn-xs { padding: .28rem .65rem; font-size: .71rem; border-radius: 7px; }
    .btn-edit { background: #fff8f0; color: var(--warn); border: 1.5px solid var(--warn); }
    .btn-edit:hover { background: var(--warn); color: #fff; }
    .btn-del  { background: #fff0f3; color: var(--danger); border: 1.5px solid var(--danger); }
    .btn-del:hover  { background: var(--danger); color: #fff; }

    /* ── Empty/loading state ── */
    .state-box {
      text-align: center; padding: 2.5rem 1rem;
      color: var(--muted); font-size: .85rem;
    }
    .state-box .icon { font-size: 2.2rem; display: block; margin-bottom: .5rem; animation: bounce 2s infinite; }
    @keyframes bounce {
      0%,100%{ transform: translateY(0); }
      50%     { transform: translateY(-8px); }
    }

    #status-strip { font-size: .72rem; color: var(--muted); text-align: right; margin-top: .75rem; min-height: 1em; }

    /* ── Divider between row groups in form ── */
    .form-divider {
      height: 1px; background: var(--border);
      margin: 1.1rem 0;
    }
  </style>
</head>
<body>

<!-- Animated Hero Banner -->
<div class="hero-banner">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="hero-content">
    <div class="logo">🗺️</div>
    <div class="header-text">
      <h1>SiWISJO</h1>
      <p>Sistem Informasi Wisatawan Daerah Jombang * Terintergrasi <code style="opacity:.8">wisatawan</code></p>
    </div>
    <div class="firebase-badge">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-label">Menghubungkan…</span>
    </div>
  </div>
</div>

<div class="layout">

  <!-- ── Form Card ── -->
  <div class="card">
    <div class="card-title" id="form-label">Tambah Data Wisatawan</div>

    <!-- Row 1: ID + Nama -->
    <div class="form-row4">
      <div class="field">
        <label for="id_wisatawan">ID Wisatawan</label>
        <input type="text" id="id_wisatawan" class="id-input" placeholder="W-001" readonly />
      </div>
      <div class="field" style="grid-column: span 3">
        <label for="nama_wisatawan">Nama Wisatawan</label>
        <input type="text" id="nama_wisatawan" placeholder="Masukkan nama lengkap…" />
      </div>
    </div>

    <div class="form-divider"></div>

    <!-- Row 2: Tempat Lahir + Tanggal Lahir -->
    <div class="form-row2">
      <div class="field">
        <label for="tempat_lahir">Tempat Lahir</label>
        <input type="text" id="tempat_lahir" placeholder="Contoh: Surabaya" />
      </div>
      <div class="field">
        <label for="tanggal_lahir">Tanggal Lahir</label>
        <input type="date" id="tanggal_lahir" />
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="btn-submit" onclick="submitForm()">＋ Simpan Data</button>
      <button class="btn-secondary" onclick="resetForm()">↺ Reset</button>
      <button class="btn-danger" id="btn-del-form" style="display:none" onclick="deleteFromForm()">🗑 Hapus</button>
    </div>
    <div id="status-strip"></div>
  </div>

  <!-- ── Table Card ── -->
  <div class="card">
    <div class="tbl-bar">
      <div style="display:flex;align-items:center;gap:.6rem;">
        <div class="card-title" style="margin:0">Daftar Wisatawan</div>
        <span class="count-badge" id="count-badge">0</span>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" placeholder="Cari nama, ID, tempat…" oninput="filterTable()" />
      </div>
    </div>

    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:110px">ID</th>
            <th>Nama Wisatawan</th>
            <th>Tempat Lahir</th>
            <th>Tanggal Lahir</th>
            <th style="width:110px">Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="state-box" id="state-box">
        <span class="icon">⏳</span>Memuat data dari Firestore…
      </div>
    </div>
  </div>

</div><!-- /layout -->

<div id="toast"></div>

<!-- ── Firebase SDK ── -->
<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc,
         addDoc, updateDoc, deleteDoc,
         onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ── Config ────────────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyAjFNucN_qgQBbeZLyxCKayPuclK5_QbbU",
  authDomain:        "project-a39ad.firebaseapp.com",
  projectId:         "project-a39ad",
  storageBucket:     "project-a39ad.firebasestorage.app",
  messagingSenderId: "1871108851",
  appId:             "1:1871108851:web:3b4f484b08e486f584f586"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const col = collection(db, "wisatawan");

// ── State ─────────────────────────────────────────────────────────────────────
let allDocs   = [];
let editDocId = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', 2700);
}

function setStatus(msg) { document.getElementById('status-strip').textContent = msg; }

function setConn(state) {
  const dot = document.getElementById('conn-dot');
  const lbl = document.getElementById('conn-label');
  if (state === 'ok')     { dot.className = 'dot connected'; lbl.textContent = 'Terhubung'; }
  if (state === 'error')  { dot.className = 'dot error';     lbl.textContent = 'Gagal'; }
  if (state === 'loading'){ dot.className = 'dot';           lbl.textContent = 'Menghubungkan…'; }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtDate(val) {
  if (!val) return '-';
  const [y,m,d] = val.split('-');
  const bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return `${+d} ${bln[+m-1]} ${y}`;
}

// ── ID generator ──────────────────────────────────────────────────────────────
function nextId() {
  if (!allDocs.length) return 'W-001';
  const nums = allDocs.map(d => {
    const m = String(d.id_wisatawan).match(/\d+$/);
    return m ? parseInt(m[0]) : 0;
  });
  return 'W-' + String(Math.max(...nums) + 1).padStart(3, '0');
}

function refreshIdPreview() {
  if (!editDocId) document.getElementById('id_wisatawan').value = nextId();
}

// ── Render table ──────────────────────────────────────────────────────────────
function renderTable() {
  const q   = document.getElementById('search').value.toLowerCase();
  const box = document.getElementById('state-box');
  document.getElementById('count-badge').textContent = allDocs.length;

  const filtered = allDocs.filter(d =>
    (d.nama_wisatawan||'').toLowerCase().includes(q) ||
    (d.id_wisatawan||'').toLowerCase().includes(q)   ||
    (d.tempat_lahir||'').toLowerCase().includes(q)
  );

  if (allDocs.length === 0) {
    document.getElementById('tbody').innerHTML = '';
    box.style.display = 'block';
    box.innerHTML = '<span class="icon">🏝️</span>Belum ada data. Isi formulir di atas untuk memulai.';
    return;
  }

  box.style.display = filtered.length ? 'none' : 'block';
  if (!filtered.length) {
    box.innerHTML = `<span class="icon">🔍</span>Tidak ditemukan hasil untuk "<strong>${esc(q)}</strong>"`;
    document.getElementById('tbody').innerHTML = '';
    return;
  }
  box.style.display = 'none';

  document.getElementById('tbody').innerHTML = filtered.map((d, i) => `
    <tr data-doc="${d.docId}" class="${editDocId === d.docId ? 'is-editing' : ''}"
        style="animation-delay:${i * 0.04}s">
      <td class="cell-id">${esc(d.id_wisatawan)}</td>
      <td><strong>${esc(d.nama_wisatawan)}</strong></td>
      <td class="cell-ttl">${esc(d.tempat_lahir || '—')}</td>
      <td class="cell-ttl">${fmtDate(d.tanggal_lahir)}</td>
      <td>
        <div class="actions">
          <button class="btn-xs btn-edit" onclick="window._editRow('${d.docId}')">✏️ Edit</button>
          <button class="btn-xs btn-del"  onclick="window._deleteRow('${d.docId}')">🗑</button>
        </div>
      </td>
    </tr>`).join('');
}

window.filterTable = renderTable;

// ── Realtime listener ─────────────────────────────────────────────────────────
onSnapshot(
  query(col, orderBy("id_wisatawan")),
  snap => {
    setConn('ok');
    allDocs = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
    refreshIdPreview();
    renderTable();
  },
  err => {
    setConn('error');
    console.error(err);
    toast('Gagal memuat data: ' + err.message, 'err');
    document.getElementById('state-box').innerHTML =
      '<span class="icon">⚠️</span>Gagal terhubung ke Firestore. Periksa Rules dan koneksi.';
  }
);

// ── Form ──────────────────────────────────────────────────────────────────────
window.resetForm = function() {
  editDocId = null;
  document.getElementById('nama_wisatawan').value  = '';
  document.getElementById('tempat_lahir').value    = '';
  document.getElementById('tanggal_lahir').value   = '';
  document.getElementById('btn-del-form').style.display = 'none';
  document.getElementById('btn-submit').textContent = '＋ Simpan Data';
  document.getElementById('form-label').textContent  = 'Tambah Data Wisatawan';
  document.querySelectorAll('tbody tr').forEach(r => r.classList.remove('is-editing'));
  refreshIdPreview();
  setStatus('');
};

window.submitForm = async function() {
  const nama   = document.getElementById('nama_wisatawan').value.trim();
  const tempat = document.getElementById('tempat_lahir').value.trim();
  const tgl    = document.getElementById('tanggal_lahir').value;

  if (!nama)   { toast('Nama wisatawan tidak boleh kosong.', 'err'); document.getElementById('nama_wisatawan').focus(); return; }
  if (!tempat) { toast('Tempat lahir tidak boleh kosong.', 'err');   document.getElementById('tempat_lahir').focus();   return; }
  if (!tgl)    { toast('Tanggal lahir tidak boleh kosong.', 'err');  document.getElementById('tanggal_lahir').focus();  return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>${editDocId ? 'Memperbarui…' : 'Menyimpan…'}`;
  setStatus('');

  const payload = { nama_wisatawan: nama, tempat_lahir: tempat, tanggal_lahir: tgl };

  try {
    if (editDocId) {
      await updateDoc(doc(db, 'wisatawan', editDocId), payload);
      toast('Data berhasil diperbarui ✓', 'ok');
    } else {
      await addDoc(col, { id_wisatawan: nextId(), ...payload });
      toast('Data berhasil disimpan ✓', 'ok');
    }
    window.resetForm();
  } catch(e) {
    toast('Gagal: ' + e.message, 'err');
    setStatus('⚠️ ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = editDocId ? '✓ Perbarui Data' : '＋ Simpan Data';
  }
};

window._editRow = function(docId) {
  const rec = allDocs.find(d => d.docId === docId);
  if (!rec) return;
  editDocId = docId;
  document.getElementById('id_wisatawan').value  = rec.id_wisatawan;
  document.getElementById('nama_wisatawan').value = rec.nama_wisatawan || '';
  document.getElementById('tempat_lahir').value   = rec.tempat_lahir   || '';
  document.getElementById('tanggal_lahir').value  = rec.tanggal_lahir  || '';
  document.getElementById('btn-submit').textContent      = '✓ Perbarui Data';
  document.getElementById('btn-del-form').style.display  = '';
  document.getElementById('form-label').textContent      = 'Edit Data Wisatawan';
  document.getElementById('nama_wisatawan').focus();
  document.querySelectorAll('tbody tr').forEach(r =>
    r.classList.toggle('is-editing', r.dataset.doc === docId));
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window._deleteRow = async function(docId) {
  const rec = allDocs.find(d => d.docId === docId);
  if (!rec || !confirm(`Hapus wisatawan "${rec.nama_wisatawan}" (${rec.id_wisatawan})?`)) return;
  try {
    await deleteDoc(doc(db, 'wisatawan', docId));
    if (editDocId === docId) window.resetForm();
    toast('Data berhasil dihapus.', 'err');
  } catch(e) { toast('Gagal menghapus: ' + e.message, 'err'); }
};

window.deleteFromForm = () => { if (editDocId) window._deleteRow(editDocId); };

document.getElementById('nama_wisatawan').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.submitForm();
});
</script>
</body>
</html>
